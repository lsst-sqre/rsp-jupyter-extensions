[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "rsp_jupyter_extensions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# jupyter_server_documents is only listed because this release disables
# manual saving, and that's only a good idea in the presence of
# jupyter_server_documents.
#
# We pin back jupyter-collaboration because 4.4.0 fails to activate, with
# an unhelpful error message, and 4.3 seems to do everything we need.
dependencies = [
    "httpx",
    "jinja2",
    "jupyterlab",
    "jupyter_server>=2.0.1,<3",
    "jupyter_ydoc>=3.5.0,<4.0.0",
    "jupyter-collaboration>=4.4.1",
    "jupyter-server-documents>=0.2.5",
    "jupyterlab>=4,<5",
    "pydantic",
    "requests",
    "rubin-repertoire",
    "xmltodict"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "mypy",
    "pre-commit",
    "pyfakefs",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
    "respx",
    "ruff",
    "scriv[toml]",
    "types-requests",
    "types-xmltodict"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build.targets.sdist]
artifacts = ["rsp_jupyter_extensions/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"rsp_jupyter_extensions/labextension" = "share/jupyter/labextensions/rsp-jupyter-extensions"
"install.json" = "share/jupyter/labextensions/rsp-jupyter-extensions/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "rsp_jupyter_extensions/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "rsp_jupyter_extensions/labextension/static/style.js",
    "rsp_jupyter_extensions/labextension/package.json",
]
skip-if-exists = ["rsp_jupyter_extensions/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "rsp_jupyter_extensions/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

[[tool.mypy.overrides]]
module = [
    "jupyterlab.*",
    "jupyter_server_documents.*",
    "jupyter_server_fileid.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"

[tool.ruff]
extend = "ruff-shared.toml"

[tool.ruff.lint.extend-per-file-ignores]
"rsp_jupyter_extensions/handlers/collab_filebrowser.py" = [
    "C901", # All those inner classes do get pretty complex
]

[tool.ruff.lint.isort]
known-first-party = [
    "rsp_jupyter_extensions"
]

[tool.scriv]
categories = [
    "Backwards-incompatible changes",
    "New features",
    "Bug fixes",
    "Other changes",
]
entry_title_template = "{{ version }} ({{ date.strftime('%Y-%m-%d') }})"
format = "md"
md_header_level = "2"
new_fragment_template = "file:changelog.d/_template.md.jinja"
skip_fragments = "_template.md.jinja"
